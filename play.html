<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Thief Online — Play</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_v2.css">
<link rel="manifest" href="manifest.json">
<script src="game.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
<style>
body { background: #0e0c0a; display:flex; align-items:center; justify-content:center; min-height:100vh; }
body::after, body::before { display: none !important; content: none !important; opacity: 0 !important; }
.portrait-box { background: transparent !important; box-shadow: none !important; border: none !important; }
.dialog { width: 560px; background: var(--bg-main); border: 1px solid var(--border-dark); box-shadow: 4px 6px 32px rgba(0,0,0,0.9); }
.start-tabs { display: flex; border-bottom: 1px solid var(--border-dark); }
.start-tab {
  flex: 1; padding: 7px 0; font-family: 'Oswald', sans-serif; font-size: 12px;
  letter-spacing: 0.5px; background: var(--bg-dark); color: var(--text-dim);
  border: none; border-right: 1px solid var(--border-dark); cursor: pointer;
}
.start-tab:last-child { border-right: none; }
.start-tab.on { background: var(--bg-panel); color: var(--border-light); }
.start-tab:hover:not(.on) { background: var(--bg-panel); color: var(--text-main); }

/* Browse tab */
.browse-wrap { display: flex; flex-direction: column; height: 100%; }
.room-list { flex: 1; overflow-y: auto; padding: 4px 6px; display: flex; flex-direction: column; gap: 3px; }
.room-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px;
  background: rgba(0,0,0,0.2); border: 1px solid var(--border-dark); font-size: 12px;
}
.room-row-name { font-family: 'Oswald', sans-serif; font-size: 13px; color: var(--text-light); flex: 1; }
.room-row-host { font-size: 10px; color: var(--text-dim); width: 70px; }
.room-row-count { font-size: 10px; color: var(--text-dim); width: 55px; }
.browse-empty { padding: 30px 16px; text-align: center; font-size: 12px; color: var(--text-dim); }
.browse-footer {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  border-top: 1px solid var(--border-dark); background: rgba(0,0,0,0.15);
}
.browse-hint { font-size: 11px; color: var(--text-dim); }
.join-input { width: 60px; text-align: center; letter-spacing: 3px; font-size: 14px; }
.refresh-pip { font-size: 10px; color: var(--text-dim); margin-left: auto; }

/* Create / Solo shared */
.setup-body { display: grid; grid-template-columns: 155px 1fr; gap: 16px; padding: 14px 16px; }
.lft { display: flex; flex-direction: column; gap: 8px; }
.portrait-box { width: 140px; height: 178px; }
.pic-nav { display: flex; gap: 3px; }
.pic-nav .btn { flex: 1; padding: 3px 0; font-size: 11px; }
.pic-lbl { font-size: 10px; color: var(--text-light); text-align: center; }
.rgt { display: flex; flex-direction: column; gap: 10px; }
.grp { display: flex; flex-direction: column; gap: 3px; }
.grp-lbl { font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-light); margin-bottom:1px; }
.opt { width: 100%; text-align: center; padding: 4px; font-size: 12px; }
.field-lbl { font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-light); margin-bottom:3px; }
.city-map-wrap { position:relative; width:100%; aspect-ratio:3/2; background:var(--bg-dark);
                 border:1px solid var(--border-dark); overflow:hidden; }
.city-map-wrap img { width:100%; height:100%; object-fit:contain; display:block; opacity:0.85; }
.city-dot { position:absolute; transform:translate(-50%,-50%); cursor:pointer; }
.city-dot .cdot { width:10px; height:10px; border-radius:50%;
                  background:rgba(180,120,40,0.85); border:2px solid #ffd080;
                  transition:background 0.15s, transform 0.15s; }
.city-dot:hover .cdot { background:#ffd080; transform:scale(1.3); }
.city-dot.on .cdot { background:#80e080; border-color:#c0ffc0; box-shadow:0 0 7px rgba(0,255,100,0.6); }
.city-dot-lbl { position:absolute; left:50%; top:12px; transform:translateX(-50%);
                white-space:nowrap; font-size:8px; color:#ffd080;
                text-shadow:0 1px 3px #000; pointer-events:none; font-family:'Oswald',sans-serif; }
.city-dot.on .city-dot-lbl { color:#c0ffc0; }
.theme-opt { display:flex; align-items:center; gap:6px; width:100%; text-align:left; padding:5px 8px; font-size:11px; }
.theme-swatch { width:14px; height:14px; border-radius:2px; border:1px solid var(--border-dark); flex-shrink:0; }

/* Character bar */
.char-bar {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-bottom: 1px solid var(--border-dark);
  background: rgba(0,0,0,0.2);
}
.char-portrait-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
.char-portrait { width: 52px; height: 66px; background: var(--bg-dark); border: 1px solid var(--border-dark); overflow: hidden; }
.char-portrait img { width: 100%; height: 100%; object-fit: contain; object-position: center; mix-blend-mode: lighten; }
.char-pic-nav { display: flex; gap: 2px; width: 100%; }
.char-pic-nav .btn { flex: 1; padding: 2px 0; font-size: 11px; }
.char-fields { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.char-name-row { display: flex; align-items: center; gap: 6px; }
.char-name-row .grp-lbl { white-space: nowrap; }
.char-prof-wrap { display: flex; flex-wrap: wrap; gap: 3px; }
.char-prof-wrap .btn { font-size: 10px; padding: 2px 6px; }
.room-name-display { font-family:'Oswald',sans-serif; font-size:20px; color:var(--border-light); letter-spacing:1px; }
.room-code-row { display:flex; align-items:center; gap:10px; }
.room-code-lbl { font-size:11px; color:var(--text-light); }
.room-code-val { font-family:'Oswald',sans-serif; font-size:28px; letter-spacing:6px;
                 color:#ffd080; background:var(--bg-dark); border:1px solid var(--border-dark);
                 padding:4px 14px; box-shadow:var(--inset); }
.room-hint { font-size:11px; color:var(--text-dim); }
.players-panel { background:var(--bg-dark); border:1px solid var(--border-dark); box-shadow:var(--inset); min-height:100px; }
.players-hd { font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-light);
              background:rgba(0,0,0,0.3); border-bottom:1px solid var(--border-dark); padding:3px 8px; }
.player-list { padding:6px 8px; display:flex; flex-direction:column; gap:4px; }
.player-row { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-light);
              padding:3px 4px; border-bottom:1px solid rgba(255,255,255,0.05); }
.player-row .p-portrait { width:28px; height:36px; flex-shrink:0; background:var(--bg-panel);
                           border:1px solid var(--border-dark); overflow:hidden; }
.player-row .p-portrait img { width:100%; height:100%; object-fit:cover; object-position:top; image-rendering:pixelated; }
.player-row .p-name { flex:1; font-family:'Oswald',sans-serif; font-size:13px; }
.player-row .p-prof { font-size:10px; color:var(--text-dim); text-transform:capitalize; }
.player-row .p-host { font-size:9px; color:var(--accent-bright); background:rgba(0,0,0,0.3);
                      border:1px solid var(--accent); padding:1px 5px; }
.player-row .p-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; background:#4caf50; }
.player-row .p-dot.away { background:#888; }
.room-status { font-size:11px; color:var(--text-dim); text-align:center; padding:4px 0; }

/* Footers */
.start-footer { display:flex; justify-content:center; gap:12px; padding:10px;
                border-top:1px solid var(--border-dark); background:rgba(0,0,0,0.15); }
.room-footer { display:flex; justify-content:space-between; align-items:center;
               padding:10px 16px; border-top:1px solid var(--border-dark); background:rgba(0,0,0,0.15); }
</style>
</head>
<body>
<div class="window dialog">
  <div class="window-titlebar">
    Car Thief Online
    <div class="win-btns"><button class="win-btn" onclick="window.location.href='index.html'">✕</button></div>
  </div>

  <!-- ── CHARACTER BAR ── -->
  <div class="char-bar" id="charBar">
    <div class="char-portrait-wrap">
      <div class="char-portrait"><img id="charPortraitImg" src="" alt=""></div>
      <div class="char-pic-nav">
        <button class="btn" onclick="navPic(-1)">‹</button>
        <button class="btn" onclick="navPic(1)">›</button>
      </div>
    </div>
    <div class="char-fields">
      <div class="char-name-row">
        <span class="grp-lbl">Name:</span>
        <input class="text-input" id="pName" maxlength="16" style="flex:1">
      </div>
      <div>
        <div class="grp-lbl" style="margin-bottom:3px">Profession:</div>
        <div class="char-prof-wrap">
          <button class="btn on" data-g="prof" data-v="actor"       onclick="pick(this)">Actor</button>
          <button class="btn"    data-g="prof" data-v="shooter"     onclick="pick(this)">Shooter</button>
          <button class="btn"    data-g="prof" data-v="thief"       onclick="pick(this)">Thief</button>
          <button class="btn"    data-g="prof" data-v="driver"      onclick="pick(this)">Driver</button>
          <button class="btn"    data-g="prof" data-v="locksmith"   onclick="pick(this)">Locksmith</button>
          <button class="btn"    data-g="prof" data-v="electrician" onclick="pick(this)">Electrician</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── TABS ── -->
  <div class="start-tabs" id="startTabs">
    <button class="start-tab on" id="tabBrowse" onclick="showTab('Browse')">BROWSE</button>
    <button class="start-tab"    id="tabCreate" onclick="showTab('Create')">CREATE</button>
  </div>

  <!-- ── BROWSE TAB ── -->
  <div class="tab-panel" id="panelBrowse">
    <div class="browse-wrap">
      <div class="room-list" id="roomList"></div>
      <div class="browse-empty" id="browseEmpty" style="display:none">No public rooms yet — create one!</div>
      <div class="browse-footer">
        <span class="browse-hint">Have a code?</span>
        <input class="text-input join-input" id="joinCode" placeholder="CODE" maxlength="4"
               oninput="this.value=this.value.toUpperCase()">
        <button class="btn" onclick="joinByCode()">Join</button>
        <span class="refresh-pip" id="refreshPip">↻ 5s</span>
      </div>
      <div id="rejoinBar" style="display:none; padding:6px 8px; border-top:1px solid var(--border-dark); background:rgba(0,0,0,0.15);">
        <button class="btn" style="width:100%;color:#4caf50;border-color:#4caf50;" onclick="window.location.href='game.html'">● RE-JOIN ACTIVE GAME</button>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="panelCreate" style="display:none">
    <div class="setup-body" style="grid-template-columns: 1fr">
      <div class="rgt">
        <div class="grp">
          <div class="grp-lbl">Room Name:</div>
          <input class="text-input" id="roomName" maxlength="20" placeholder="My Game" style="width:100%">
        </div>
        <div class="grp">
          <div class="grp-lbl">Visibility:</div>
          <button class="btn opt on" data-g="vis" data-v="public"  onclick="pick(this)">Public</button>
          <button class="btn opt"    data-g="vis" data-v="private" onclick="pick(this)">Private</button>
        </div>
        <div class="grp">
          <div class="grp-lbl">Starting City:</div>
          <div class="city-map-wrap" id="cityMapWrapCreate">
            <img src="Graphics/UI_elements/map_usa.bmp" onerror="this.style.opacity='0.1'" alt="USA">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── ROOM PANEL (replaces tabs after create/join) ── -->
  <div id="roomPanel" style="display:none; flex-direction:column; padding:14px 16px; gap:12px">
    <div class="room-name-display" id="roomNameDisplay"></div>
    <div class="room-code-row">
      <span class="room-code-lbl">Code:</span>
      <span class="room-code-val" id="roomCodeVal">----</span>
      <span class="room-hint">Share with friends</span>
    </div>
    <div class="players-panel">
      <div class="players-hd">Players</div>
      <div class="player-list" id="playerList"></div>
    </div>
  </div>

  <!-- ── FOOTERS ── -->
  <div class="start-footer" id="startFooter">
    <span id="footerBrowse"></span>
    <span id="roomStatus" style="font-size:11px;color:var(--text-dim);flex:1;text-align:center"></span>
    <button class="btn btn-go" id="footerCreateBtn" style="display:none" onclick="doCreate()">Create Room</button>
  </div>
  <div class="room-footer" id="roomPanelFooter" style="display:none">
    <button class="btn" onclick="leaveRoom()">Leave</button>
    <button class="btn btn-go" id="startBtn" onclick="startGame()" style="display:none">Start Game</button>
    <span id="waitingMsg" style="font-size:11px;color:var(--text-dim)"></span>
  </div>
</div><!-- /window -->

<script>
// ---------------------------------------------------------------------------
// PORTRAITS
// ---------------------------------------------------------------------------
const picPaths = [
  'Graphics/portraits/portrait_1.png',
  'Graphics/portraits/portrait_2.png',
  'Graphics/portraits/portrait_3.png',
  'Graphics/portraits/portrait_4.png',
  'Graphics/portraits/portrait_5.png',
  'Graphics/portraits/portrait_6.png',
  'Graphics/portraits/portrait_7.png',
  'Graphics/portraits/portrait_8.png',
  'Graphics/portraits/portrait_9.png',
  'Graphics/portraits/portrait_10.png',
  'Graphics/portraits/portrait_11.png',
  'Graphics/portraits/portrait_12.png',
  'Graphics/portraits/portrait_13.png',
  'Graphics/portraits/portrait_14.png',
  'Graphics/portraits/portrait_15.png',
  'Graphics/portraits/portrait_16.png',
  'Graphics/portraits/portrait_17.png',
  'Graphics/portraits/portrait_18.png',
];
const PIC_TOTAL = picPaths.length;
let picIdx = 1;

function updatePortrait() {
  const src = picPaths[picIdx - 1];
  document.getElementById('charPortraitImg').src = src;
  const old = document.getElementById('portraitImg');
  if (old) old.src = src;
  document.getElementById('picLbl') && (document.getElementById('picLbl').textContent = `Picture: ${picIdx} (out of ${PIC_TOTAL})`);
}

function navPic(d) {
  picIdx = ((picIdx - 1 + d % PIC_TOTAL + PIC_TOTAL) % PIC_TOTAL) + 1;
  updatePortrait();
}

function pick(btn) {
  document.querySelectorAll(`[data-g="${btn.dataset.g}"]`).forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Pre-fill name from auth
const _storedName = sessionStorage.getItem('playerName');
if (_storedName) {
  document.getElementById('pName').value = _storedName;
}

// ---------------------------------------------------------------------------
// CITY DOTS
// ---------------------------------------------------------------------------
function buildCityMap(wrapId) {
  const wrap = document.getElementById(wrapId);
  CITIES.forEach((city, i) => {
    const dot = document.createElement('div');
    dot.className = 'city-dot' + (i === 0 ? ' on' : '');
    dot.style.left = city.dotX + '%';
    dot.style.top  = city.dotY + '%';
    dot.dataset.cityId = city.id;
    dot.innerHTML = `<div class="cdot"></div><div class="city-dot-lbl">${city.name.split(',')[0]}</div>`;
    dot.addEventListener('click', () => {
      wrap.querySelectorAll('.city-dot').forEach(d => d.classList.remove('on'));
      dot.classList.add('on');
    });
    wrap.appendChild(dot);
  });
}

// ---------------------------------------------------------------------------
// LOC_DEFS
// ---------------------------------------------------------------------------
const LOC_DEFS = [
  { id:'highway_0',     type:'highway'     },
  { id:'highway_1',     type:'highway'     },
  { id:'residential_0', type:'residential' },
  { id:'residential_1', type:'residential' },
  { id:'residential_2', type:'residential' },
  { id:'busy_0',        type:'busy'        },
  { id:'busy_1',        type:'busy'        },
  { id:'busy_2',        type:'busy'        },
  { id:'racing_0',      type:'racing'      },
  { id:'racing_1',      type:'racing'      },
];

// ---------------------------------------------------------------------------
// TABS
// ---------------------------------------------------------------------------
function showTab(name) {
  ['Browse','Create'].forEach(t => {
    document.getElementById('panel'+t).style.display = t === name ? '' : 'none';
    document.getElementById('tab'+t).classList.toggle('on', t === name);
  });
  updateFooter(name);
  if (name === 'Browse') startBrowsing();
  else stopBrowsing();
}

function updateFooter(name) {
  document.getElementById('footerCreateBtn').style.display = name === 'Create' ? '' : 'none';
}

// ---------------------------------------------------------------------------
// BROWSE — WebSocket room list
// ---------------------------------------------------------------------------
let browseWs    = null;
let browseTimer = null;
let refreshCountdown = 5;

function startBrowsing() {
  if (browseWs && browseWs.readyState <= 1) return;
  browseWs = new WebSocket(location.hostname === 'localhost' ? 'ws://localhost:8080' : 'wss://car-thief-online-production.up.railway.app');
  browseWs.onopen    = () => browseWs.send(JSON.stringify({ type: 'get_room_list' }));
  browseWs.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'room_list') renderRoomList(msg.rooms);
  };
  browseWs.onclose = () => { browseWs = null; };

  refreshCountdown = 5;
  clearInterval(browseTimer);
  browseTimer = setInterval(() => {
    refreshCountdown--;
    document.getElementById('refreshPip').textContent = '↻ ' + refreshCountdown + 's';
    if (refreshCountdown <= 0) {
      refreshCountdown = 5;
      if (browseWs && browseWs.readyState === 1) {
        browseWs.send(JSON.stringify({ type: 'get_room_list' }));
      }
    }
  }, 1000);
}

function stopBrowsing() {
  clearInterval(browseTimer);
  if (browseWs) { browseWs.close(); browseWs = null; }
}

function renderRoomList(rooms) {
  const list  = document.getElementById('roomList');
  const empty = document.getElementById('browseEmpty');
  list.innerHTML = '';
  if (!rooms.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';
  rooms.forEach(r => {
    const row = document.createElement('div');
    row.className = 'room-row';
    row.innerHTML = `
      <div class="room-row-name">${esc(r.roomName)}</div>
      <div class="room-row-host">${esc(r.hostName)}</div>
      <div class="room-row-count">${r.playerCount} player${r.playerCount !== 1 ? 's' : ''}</div>
      <button class="btn btn-sm" onclick="joinRoom('${esc(r.code)}')">Join</button>`;
    list.appendChild(row);
  });
}

function joinByCode() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (code.length !== 4) { alert('Enter a 4-letter room code.'); return; }
  joinRoom(code);
}

function joinRoom(code) {
  const token = sessionStorage.getItem('fbToken');
  if (!token) {
    window.location.href = `auth.html?then=play.html&join=${code}`;
    return;
  }
  stopBrowsing();
  connectWs(() => send({ type: 'join_room', code, ...getCharacter() }));
}

// ---------------------------------------------------------------------------
// CREATE
// ---------------------------------------------------------------------------
function doCreate() {
  const token = sessionStorage.getItem('fbToken');
  if (!token) { window.location.href = 'auth.html?then=play.html'; return; }
  const ch = getCharacter();
  sessionStorage.setItem('startCityId', ch.startCityId);
  connectWs(() => send({
    type:     'create_room',
    roomName: document.getElementById('roomName').value.trim() || 'My Game',
    isPublic: document.querySelector('[data-g="vis"].on')?.dataset.v !== 'private',
    ...ch,
  }));
}

// ---------------------------------------------------------------------------
// SHARED WS
// ---------------------------------------------------------------------------
const WS_URL = location.hostname === 'localhost' ? 'ws://localhost:8080' : 'wss://car-thief-online-production.up.railway.app';
let ws     = null;
let myId   = null;
let myCode = null;
let isHost = false;

function connectWs(onAuth) {
  const getToken = () => {
    const user = firebase.auth().currentUser;
    if (user) return user.getIdToken();
    return Promise.resolve(sessionStorage.getItem('fbToken'));
  };
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    getToken().then(token => {
      sessionStorage.setItem('fbToken', token);
      ws.send(JSON.stringify({ type: 'auth', token }));
    });
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'auth_ok') { onAuth(); return; }
    handleMsg(msg);
  };
  ws.onerror = () => setRoomStatus('Could not reach server.');
  ws.onclose = () => { if (myCode) setRoomStatus('Disconnected.'); };
}

function send(msg) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

function getCharacter() {
  return {
    name:        (document.getElementById('pName')?.value || 'Player').trim(),
    portraitSrc: picPaths[picIdx - 1],
    profession:  document.querySelector('[data-g="prof"].on')?.dataset.v || 'actor',
    startCityId: document.querySelector('#cityMapWrapCreate .city-dot.on')?.dataset.cityId || 'las_vegas',
  };
}

// ---------------------------------------------------------------------------
// MESSAGE HANDLER
// ---------------------------------------------------------------------------
function handleMsg(msg) {
  switch (msg.type) {
    case 'room_created':
      myId = msg.playerId; myCode = msg.code; isHost = true;
      showRoomPanel(msg.roomName, msg.code, msg.players);
      break;
    case 'room_joined':
      myId = msg.playerId; myCode = msg.code; isHost = false;
      showRoomPanel(msg.roomName, msg.code, msg.players);
      break;
    case 'player_joined':
      addPlayerRow(msg.player);
      break;
    case 'player_disconnected': {
      const row = document.getElementById('pr_' + msg.playerId);
      if (row) row.querySelector('.p-dot').classList.add('away');
      break;
    }
    case 'player_reconnected': {
      const row = document.getElementById('pr_' + msg.playerId);
      if (row) row.querySelector('.p-dot').classList.remove('away');
      break;
    }
    case 'game_started':
      localStorage.setItem('playerId',      myId);
      localStorage.setItem('roomCode',      myCode);
      sessionStorage.setItem('isHost',        isHost ? '1' : '0');
      sessionStorage.setItem('gameState',     JSON.stringify(msg.state));
      sessionStorage.setItem('locationPools', JSON.stringify(msg.locationPools));
      sessionStorage.setItem('locDefs',       JSON.stringify(msg.locDefs));
      sessionStorage.setItem('nextDayAt',     msg.nextDayAt);
      sessionStorage.setItem('playerName',    msg.state.playerName);
      sessionStorage.setItem('portraitSrc',   msg.state.portraitSrc);
      sessionStorage.setItem('profession',    msg.state.profession);
      window.location.href = 'game.html';
      break;
    case 'error':
      setRoomStatus('Error: ' + msg.msg);
      break;
  }
}

// ---------------------------------------------------------------------------
// ROOM PANEL
// ---------------------------------------------------------------------------
function showRoomPanel(roomName, code, players) {
  document.getElementById('charBar').style.display          = 'none';
  document.getElementById('startTabs').style.display        = 'none';
  document.getElementById('panelBrowse').style.display  = 'none';
  document.getElementById('panelCreate').style.display  = 'none';
  document.getElementById('startFooter').style.display  = 'none';
  document.getElementById('roomPanel').style.display       = 'flex';
  document.getElementById('roomPanelFooter').style.display = 'flex';
  document.getElementById('roomNameDisplay').textContent   = roomName;
  document.getElementById('roomCodeVal').textContent       = code;
  if (isHost) {
    document.getElementById('startBtn').style.display  = '';
    document.getElementById('waitingMsg').textContent  = '';
  } else {
    document.getElementById('startBtn').style.display  = 'none';
    document.getElementById('waitingMsg').textContent  = 'Waiting for host to start...';
  }
  renderPlayers(players);
}

function renderPlayers(players) {
  document.getElementById('playerList').innerHTML = '';
  players.forEach(addPlayerRow);
}

function addPlayerRow(p) {
  const existing = document.getElementById('pr_' + p.id);
  if (existing) existing.remove();
  const row = document.createElement('div');
  row.className = 'player-row'; row.id = 'pr_' + p.id;
  const isSelf = p.id === myId;
  row.innerHTML = `
    <div class="p-dot"></div>
    <div class="p-portrait"><img src="${p.portraitSrc||''}" onerror="this.style.opacity='.2'"></div>
    <span class="p-name">${esc(p.name)}${isSelf?' <span style="color:#ffd080;font-size:10px">(you)</span>':''}</span>
    <span class="p-prof">${p.profession||''}</span>
    ${isHost && p.id === myId ? '<span class="p-host">HOST</span>' : ''}`;
  document.getElementById('playerList').appendChild(row);
}

function leaveRoom() {
  if (ws) ws.close();
  location.reload();
}

function startGame() {
  const startCityId = sessionStorage.getItem('startCityId') || 'las_vegas';
  const locDefs = _generateCityLocations(startCityId);
  send({ type: 'start_game', locDefs });
}

function setRoomStatus(msg) {
  document.getElementById('roomStatus').textContent = msg;
}

// ---------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------
window.addEventListener('load', () => {
  // Login gate — must be authenticated to use this page
  if (!sessionStorage.getItem('fbToken')) {
    const params = new URLSearchParams(location.search);
    const join   = params.get('join');
    window.location.href = 'auth.html?then=play.html' + (join ? '&join=' + join : '');
    return;
  }

  updatePortrait();
  buildCityMap('cityMapWrapCreate');

  // Show Re-join bar if player has an active session
  const hasSession = localStorage.getItem('roomCode') && localStorage.getItem('playerId');
  if (hasSession) document.getElementById('rejoinBar').style.display = '';

  const params = new URLSearchParams(location.search);
  const join   = params.get('join');
  if (join) {
    showTab('Browse');
    joinRoom(join);
  } else {
    showTab('Browse');
  }
});
</script>
</body>
