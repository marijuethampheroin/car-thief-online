<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Thief Online � Lobby</title>
<link rel="stylesheet" href="styles.css">
<script src="game.js"></script>
<style>
body { background: #2e1800; }

.dialog {
  width: 520px;
  background-image: url('Graphics/UI_elements/background.bmp');
  background-size: cover;
}

/* -- Phase: Setup -------------------------------------------- */
.setup-body {
  display: grid;
  grid-template-columns: 155px 1fr;
  gap: 16px;
  padding: 14px 16px;
}
.lft { display: flex; flex-direction: column; gap: 8px; }
.portrait-box { width: 140px; height: 178px; }
.pic-nav { display: flex; gap: 3px; }
.pic-nav .btn { flex: 1; padding: 3px 0; font-size: 11px; }
.pic-lbl { font-size: 10px; color: var(--text-light); text-align: center; }
.rgt { display: flex; flex-direction: column; gap: 10px; }
.grp { display: flex; flex-direction: column; gap: 3px; }
.grp-lbl { font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-light);
           display:flex; align-items:center; gap:4px; margin-bottom:1px; }
.opt { width:100%; text-align:center; padding:4px; font-size:12px; }
.field-lbl { font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-light); margin-bottom:3px; }

/* city picker */
.city-map-wrap { position:relative; width:100%; aspect-ratio:3/2; background:var(--bg-dark);
                 border:1px solid var(--border-dark); overflow:hidden; }
.city-map-wrap img { width:100%; height:100%; object-fit:contain; display:block; opacity:0.85; }
.city-dot { position:absolute; transform:translate(-50%,-50%); cursor:pointer; }
.city-dot .cdot { width:10px; height:10px; border-radius:50%;
                  background:rgba(180,120,40,0.85); border:2px solid #ffd080;
                  transition:background 0.15s, transform 0.15s; }
.city-dot:hover .cdot { background:#ffd080; transform:scale(1.3); }
.city-dot.on .cdot { background:#80e080; border-color:#c0ffc0;
                     box-shadow:0 0 7px rgba(0,255,100,0.6); }
.city-dot-lbl { position:absolute; left:50%; top:12px; transform:translateX(-50%);
                white-space:nowrap; font-size:8px; color:#ffd080;
                text-shadow:0 1px 3px #000; pointer-events:none; font-family:'Oswald',sans-serif; }
.city-dot.on .city-dot-lbl { color:#c0ffc0; }
.city-sel-lbl { font-size:10px; color:var(--text-dim); text-align:center; margin-top:2px; }

.setup-footer {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  border-top: 1px solid var(--border-dark);
  background: rgba(0,0,0,0.15);
}
.setup-footer .spacer { flex: 1; }
.join-input {
  width: 70px; text-align: center; letter-spacing: 3px; font-size: 14px;
}

/* -- Phase: Room -------------------------------------------- */
.room-body { display: none; flex-direction: column; padding: 14px 16px; gap: 12px; }

.room-code-row {
  display: flex; align-items: center; gap: 10px;
}
.room-code-lbl { font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-light); }
.room-code-val {
  font-family:'Oswald',sans-serif; font-size:28px; letter-spacing:6px;
  color: #ffd080; background: var(--bg-dark);
  border: 1px solid var(--border-dark);
  padding: 4px 14px; box-shadow: var(--inset);
}
.room-hint { font-size:11px; color:var(--text-dim); }

.players-panel {
  background: var(--bg-dark); border: 1px solid var(--border-dark);
  box-shadow: var(--inset); min-height: 120px;
}
.players-hd {
  font-family:'Oswald',sans-serif; font-size:11px; color:var(--text-light);
  background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-dark);
  padding: 3px 8px; letter-spacing: 0.4px;
}
.player-list { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.player-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-light); padding: 3px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.player-row .p-portrait {
  width: 28px; height: 36px; flex-shrink: 0;
  background: var(--bg-panel); border: 1px solid var(--border-dark);
  overflow: hidden;
}
.player-row .p-portrait img {
  width: 100%; height: 100%; object-fit: cover; object-position: top; image-rendering: pixelated;
}
.player-row .p-name { flex: 1; font-family:'Oswald',sans-serif; font-size:13px; }
.player-row .p-prof { font-size:10px; color:var(--text-dim); text-transform:capitalize; }
.player-row .p-host {
  font-size:9px; color: var(--accent-bright);
  background: rgba(0,0,0,0.3); border: 1px solid var(--accent);
  padding: 1px 5px; letter-spacing: 0.4px;
}
.player-row .p-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #4caf50;
}
.player-row .p-dot.away { background: #888; }

.room-status {
  font-size:11px; color:var(--text-dim); text-align:center; padding: 4px 0;
}

.room-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px;
  border-top: 1px solid var(--border-dark);
  background: rgba(0,0,0,0.15);
}

/* -- Connecting overlay ------------------------------------ */
.connecting {
  display: none; align-items: center; justify-content: center;
  padding: 40px 16px;
  font-family:'Oswald',sans-serif; font-size:14px; color:var(--text-light);
  letter-spacing:1px;
}
</style>
<link rel="manifest" href="/manifest.json">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script></head>
<body>
<div class="window dialog">
  <div class="window-titlebar">
    Car Thief Online � Multiplayer Lobby
    <div class="win-btns"><button class="win-btn">?</button></div>
  </div>

  <!-- -- PHASE 1: Setup ------------------------------------ -->
  <div class="setup-body" id="phaseSetup">
    <div class="lft">
      <div>
        <div class="field-lbl">Your Name:</div>
        <input class="text-input" id="pName" value="Player" style="width:140px">
      </div>
      <div class="portrait-box portrait" id="portraitBox">
        <img id="portraitImg" src="" alt=""
             style="width:100%;height:100%;object-fit:cover;object-position:top;image-rendering:pixelated"
             onerror="this.style.opacity='0.2'">
      </div>
      <div class="pic-lbl" id="picLbl">Picture: 1 (out of 28)</div>
      <div class="pic-nav">
        <button class="btn" onclick="navPic(-29)">�</button>
        <button class="btn" onclick="navPic(-1)">�</button>
        <button class="btn" onclick="navPic(1)">�</button>
        <button class="btn" onclick="navPic(29)">�</button>
      </div>
    </div>

    <div class="rgt">
      <div class="grp">
        <div class="grp-lbl">Profession:</div>
        <button class="btn opt on" data-g="prof" data-v="actor"       onclick="pick(this)">Actor</button>
        <button class="btn opt"    data-g="prof" data-v="shooter"     onclick="pick(this)">Shooter</button>
        <button class="btn opt"    data-g="prof" data-v="thief"       onclick="pick(this)">Thief</button>
        <button class="btn opt"    data-g="prof" data-v="driver"      onclick="pick(this)">Driver</button>
        <button class="btn opt"    data-g="prof" data-v="locksmith"   onclick="pick(this)">Locksmith</button>
        <button class="btn opt"    data-g="prof" data-v="electrician" onclick="pick(this)">Electrician</button>
      </div>

      <!-- STARTING CITY -->
      <div class="grp">
        <div class="grp-lbl">Starting City:</div>
        <div class="city-map-wrap" id="cityMapWrap">
          <img src="Graphics/UI_elements/map_usa.bmp" onerror="this.style.opacity='0.1'" alt="USA">
        </div>
        <div class="city-sel-lbl" id="citySelLbl">Las Vegas, NV</div>
      </div>

    </div>
  </div>

  <div class="setup-footer" id="setupFooter">
    <button class="btn btn-go" onclick="doCreate()">Create Room</button>
    <div class="spacer"></div>
    <input class="text-input join-input" id="joinCode" placeholder="CODE" maxlength="4"
           oninput="this.value=this.value.toUpperCase()">
    <button class="btn" onclick="doJoin()">Join Room</button>
  </div>

  <!-- -- PHASE 2: Connecting ------------------------------ -->
  <div class="connecting" id="phaseConnecting">
    Connecting<span id="dots"></span>
  </div>

  <!-- -- PHASE 3: Room ------------------------------------ -->
  <div class="room-body" id="phaseRoom">
    <div class="room-code-row">
      <span class="room-code-lbl">Room Code:</span>
      <span class="room-code-val" id="roomCodeVal">----</span>
      <span class="room-hint" id="roomHint">Share this code with friends</span>
    </div>

    <div class="players-panel">
      <div class="players-hd">Players</div>
      <div class="player-list" id="playerList"></div>
    </div>

    <div class="room-status" id="roomStatus">Waiting for host to start...</div>
  </div>

  <div class="room-footer" id="roomFooter" style="display:none">
    <button class="btn" onclick="leaveRoom()">Leave</button>
    <button class="btn btn-go" id="startBtn" onclick="startGame()" style="display:none">
      Start Game
    </button>
    <span id="waitingMsg" style="font-size:11px;color:var(--text-dim)"></span>
  </div>
</div><!-- /window -->

<script>
// ---------------------------------------------------------------------------
// PORTRAIT PICKER
// ---------------------------------------------------------------------------
let picIdx = 1;
const PIC_TOTAL = 28;
const picPaths = Array.from({length:PIC_TOTAL}, (_,i) =>
  `Graphics/character_portraits_full/person${String(i+1).padStart(2,'0')}.bmp`
);
function updatePortrait() {
  document.getElementById('picLbl').textContent = `Picture: ${picIdx} (out of ${PIC_TOTAL})`;
  document.getElementById('portraitImg').src = picPaths[picIdx - 1];
}
function navPic(d) {
  picIdx = ((picIdx - 1 + d % PIC_TOTAL + PIC_TOTAL) % PIC_TOTAL) + 1;
  updatePortrait();
}
function pick(btn) {
  const g = btn.dataset.g;
  document.querySelectorAll(`[data-g="${g}"]`).forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}
updatePortrait();

// Pre-fill name from auth if available
const _storedName = sessionStorage.getItem('playerName');
if (_storedName) document.getElementById('pName').value = _storedName;

// City picker dots (lobby reuses same CSS as index.html)
const cityMapWrap = document.getElementById('cityMapWrap');
CITIES.forEach((city, i) => {
  const dot = document.createElement('div');
  dot.className = 'city-dot' + (i === 0 ? ' on' : '');
  dot.style.left = city.dotX + '%';
  dot.style.top  = city.dotY + '%';
  dot.dataset.cityId = city.id;
  dot.innerHTML = `<div class="cdot"></div><div class="city-dot-lbl">${city.name.split(',')[0]}</div>`;
  dot.addEventListener('click', () => {
    cityMapWrap.querySelectorAll('.city-dot').forEach(d => d.classList.remove('on'));
    dot.classList.add('on');
    document.getElementById('citySelLbl').textContent = city.name;
  });
  cityMapWrap.appendChild(dot);
});

// ---------------------------------------------------------------------------
// WEBSOCKET
// ---------------------------------------------------------------------------
const WS_URL = `ws://${location.hostname}:8080`;
let ws = null;
let myId = null;
let myCode = null;
let isHost = false;
let dotsTimer = null;

function getCharacter() {
  return {
    name:        document.getElementById('pName').value.trim() || 'Player',
    portraitSrc: picPaths[picIdx - 1],
    profession:  document.querySelector('[data-g="prof"].on')?.dataset.v || 'actor',
    startCityId: document.querySelector('.city-dot.on')?.dataset.cityId || 'las_vegas',
  };
}

function connect(onAuth) {
  const token = sessionStorage.getItem('fbToken');
  if (!token) { window.location.href = 'auth.html'; return; }
  setPhase('connecting');
  startDots();
  ws = new WebSocket(WS_URL);
  ws.onopen  = () => {
    stopDots();
    // Authenticate before doing anything else
    ws.send(JSON.stringify({ type:'auth', token }));
  };
  ws.onclose = () => { if (myCode) setStatus('Disconnected from server.'); };
  ws.onerror = () => { setStatus('Could not reach server. Is server.js running?'); setPhase('setup'); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'auth_ok') { onAuth(); return; }
    handleMsg(msg);
  };
}

function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

// ---------------------------------------------------------------------------
// ROOM ACTIONS
// ---------------------------------------------------------------------------
function doCreate() {
  const ch = getCharacter();
  connect(() => send({ type:'create_room', ...ch }));
}

function doJoin() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (code.length !== 4) { alert('Enter a 4-letter room code.'); return; }
  const ch = getCharacter();
  connect(() => send({ type:'join_room', code, ...ch }));
}

function startGame() {
  // Send locDefs so the server can build the shared vehicle pool
  send({ type:'start_game', locDefs: LOC_DEFS, startCityId: getCharacter().startCityId });
}

function leaveRoom() {
  if (ws) ws.close();
  setPhase('setup');
}

// ---------------------------------------------------------------------------
// MESSAGE HANDLER
// ---------------------------------------------------------------------------
function handleMsg(msg) {
  switch (msg.type) {

    case 'room_created':
      myId   = msg.playerId;
      myCode = msg.code;
      isHost = true;
      setPhase('room');
      document.getElementById('roomCodeVal').textContent = msg.code;
      document.getElementById('roomHint').textContent = 'Share this code with friends';
      document.getElementById('startBtn').style.display = '';
      document.getElementById('waitingMsg').textContent = '';
      renderPlayers(msg.players);
      setStatus('Waiting for players to join...');
      break;

    case 'room_joined':
      myId   = msg.playerId;
      myCode = msg.code;
      isHost = false;
      setPhase('room');
      document.getElementById('roomCodeVal').textContent = msg.code;
      document.getElementById('roomHint').textContent = 'Joined room';
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('waitingMsg').textContent = 'Waiting for host to start...';
      renderPlayers(msg.players);
      setStatus('');
      break;

    case 'player_joined':
      addPlayerRow(msg.player);
      setStatus(`${msg.player.name} joined.`);
      break;

    case 'player_disconnected': {
      const row = document.getElementById('pr_' + msg.playerId);
      if (row) { row.querySelector('.p-dot').classList.add('away'); }
      break;
    }

    case 'player_reconnected': {
      const row = document.getElementById('pr_' + msg.playerId);
      if (row) { row.querySelector('.p-dot').classList.remove('away'); }
      break;
    }

    case 'game_started':
      // Save everything the client needs, then navigate
      sessionStorage.setItem('playerId',      myId);
      sessionStorage.setItem('roomCode',      myCode);
      sessionStorage.setItem('isHost',        isHost ? '1' : '0');
      msg.state.locationPools = msg.locationPools;
      sessionStorage.setItem('gameState',     JSON.stringify(msg.state));
      sessionStorage.setItem('locationPools', JSON.stringify(msg.locationPools));
      sessionStorage.setItem('playerName',    msg.state.playerName);
      sessionStorage.setItem('portraitSrc',   msg.state.portraitSrc);
      sessionStorage.setItem('profession',    msg.state.profession);
      // Keep WS alive � main.html will reconnect using stored id/code
      window.location.href = 'game.html';
      break;

    case 'error':
      setStatus('Error: ' + msg.msg);
      break;
  }
}

// ---------------------------------------------------------------------------
// RENDER HELPERS
// ---------------------------------------------------------------------------
function renderPlayers(players) {
  document.getElementById('playerList').innerHTML = '';
  players.forEach(addPlayerRow);
}

function addPlayerRow(p) {
  const list = document.getElementById('playerList');
  // Remove existing row for this id if present (reconnect case)
  const existing = document.getElementById('pr_' + p.id);
  if (existing) existing.remove();

  const row = document.createElement('div');
  row.className = 'player-row';
  row.id = 'pr_' + p.id;
  const isSelf = p.id === myId;
  row.innerHTML = `
    <div class="p-dot"></div>
    <div class="p-portrait">
      <img src="${p.portraitSrc || ''}" onerror="this.style.opacity='0.2'" alt="">
    </div>
    <span class="p-name">${esc(p.name)}${isSelf ? ' <span style="color:#ffd080;font-size:10px">(you)</span>' : ''}</span>
    <span class="p-prof">${p.profession || ''}</span>
    ${p.id === (myCode ? getHostId() : '') ? '<span class="p-host">HOST</span>' : ''}
  `;
  list.appendChild(row);
}

// Host is whoever created the room � we track isHost locally; for display
// purposes the host is simply the first player in the list (id matches myId when isHost).
function getHostId() { return isHost ? myId : null; }

function setStatus(msg) {
  document.getElementById('roomStatus').textContent = msg;
}

function setPhase(phase) {
  document.getElementById('phaseSetup').style.display      = phase === 'setup'       ? 'grid' : 'none';
  document.getElementById('setupFooter').style.display     = phase === 'setup'       ? 'flex' : 'none';
  document.getElementById('phaseConnecting').style.display = phase === 'connecting'  ? 'flex' : 'none';
  document.getElementById('phaseRoom').style.display       = phase === 'room'        ? 'flex' : 'none';
  document.getElementById('roomFooter').style.display      = phase === 'room'        ? 'flex' : 'none';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function startDots() {
  let n = 0;
  dotsTimer = setInterval(() => {
    document.getElementById('dots').textContent = '.'.repeat((n++ % 3) + 1);
  }, 400);
}
function stopDots() { clearInterval(dotsTimer); }

// ---------------------------------------------------------------------------
// LOC_DEFS � canonical stealable location list sent to server on start_game.
// Must match the stealable entries in main.html's mapIcons array.
// ---------------------------------------------------------------------------
const LOC_DEFS = [
  { id:'highway_0',     type:'highway'     },
  { id:'highway_1',     type:'highway'     },
  { id:'residential_0', type:'residential' },
  { id:'residential_1', type:'residential' },
  { id:'residential_2', type:'residential' },
  { id:'busy_0',        type:'busy'        },
  { id:'busy_1',        type:'busy'        },
  { id:'busy_2',        type:'busy'        },
  { id:'racing_0',      type:'racing'      },
  { id:'racing_1',      type:'racing'      },
];
</script>
</body>
</html>
