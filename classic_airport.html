<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Thief Online � Airport</title>
<link rel="stylesheet" href="styles.css">
<script src="game.js"></script>
<style>
  .airport-wrap {
    display: flex;
    height: 100%;
    gap: 0;
  }
  /* Left panel */
  .ap-left {
    width: 140px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 6px;
    border-right: 1px solid var(--border-dark);
    background: var(--bg-panel);
    gap: 6px;
  }
  .ap-airport-img {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--bg-dark);
    border: 1px solid var(--border-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 10px;
    overflow: hidden;
  }
  .ap-airport-img img { width: 100%; height: 100%; object-fit: cover; }
  .ap-airport-name {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    color: var(--text-light);
    line-height: 1.3;
  }
  .ap-airport-name span { display: block; font-size: 9px; color: var(--text-dim); }
  .ap-action-btns { display: flex; flex-direction: column; gap: 5px; margin-top: auto; }
  .ap-btn {
    padding: 5px 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: 1px solid var(--border-dark);
    background: var(--bg-dark);
    color: var(--text-light);
    text-align: center;
  }
  .ap-btn:hover { background: var(--accent); color: #1a0e00; }
  .ap-btn:disabled { opacity: 0.4; pointer-events: none; }
  .ap-btn-flyto { background: #1a3a1a; color: #80e080; border-color: #2a5a2a; }
  .ap-btn-flyto:hover { background: #2a5a2a; color: #c0ffc0; }
  .ap-btn-flyto:disabled { background: var(--bg-dark); color: var(--text-dim); }


  /* Center � USA map */
  .ap-map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg-dark);
  }
  .ap-map-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
    opacity: 0.85;
  }
  .ap-city-dot {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 2;
  }
  .ap-city-dot .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(180,120,40,0.85);
    border: 2px solid #ffd080;
    box-shadow: 0 0 6px rgba(255,180,0,0.5);
    transition: background 0.15s, transform 0.15s;
  }
  .ap-city-dot:hover .dot { background: #ffd080; transform: scale(1.25); }
  .ap-city-dot.selected .dot { background: #80e080; border-color: #c0ffc0; box-shadow: 0 0 8px rgba(0,255,100,0.6); }
  .ap-city-dot.current-city .dot { background: #e08040; border-color: #ffaa40; cursor: not-allowed; }
  .ap-city-dot.current-city:hover .dot { transform: none; }
  .ap-city-label {
    position: absolute;
    left: 50%; top: 14px;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    color: #ffd080;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
    pointer-events: none;
  }
  .ap-city-dot.current-city .ap-city-label { color: #ffaa40; }
  .ap-city-dot.selected .ap-city-label { color: #c0ffc0; }

  /* Bottom bar */
  .ap-bottom {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 10px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border-dark);
    font-size: 11px;
    color: var(--text-dim);
  }
  .ap-bottom .ap-status { flex: 1; font-family: 'Oswald', sans-serif; color: var(--text-light); }
  .ap-bottom .ap-cost { color: #ffd080; }
  .ap-bottom .ap-err  { color: #e08080; }
  .ap-cancel-btn {
    padding: 4px 14px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    cursor: pointer;
    border: 1px solid var(--border-dark);
    background: var(--bg-dark);
    color: var(--text-dim);
  }
  .ap-cancel-btn:hover { color: var(--text-light); background: var(--bg-panel); }
</style>
<link rel="manifest" href="/manifest.json">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script></head>
<body class="main-screen">
<div class="window game-window" style="display:flex;flex-direction:column">

  <!-- HUD (compact) -->
  <div class="hud">
    <div class="hud-row">
      <span>Day <span class="hud-val" id="day">1</span></span>
      <span class="hud-sep">|</span>
      <span>Debt: <span class="hud-val debt-val" id="debt">$0</span></span>
      <div class="hud-spacer"></div>
      <button class="menu-btn">Menu ?</button>
    </div>
    <div class="hud-row">
      <span>Cash: <span class="hud-val" id="cash">$0</span></span>
      <span class="hud-sep">|</span>
      <span>Daily Costs: <span class="hud-val" id="daily">$0</span></span>
    </div>
  </div>

  <!-- BODY -->
  <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
    <div class="airport-wrap" style="flex:1;min-height:0;">

      <!-- LEFT -->
      <div class="ap-left">
        <div class="ap-airport-img">
          <img src="Graphics/UI_elements/map_usa.bmp"
               style="object-fit:cover;object-position:30% 50%"
               onerror="this.parentElement.textContent='?'"
               alt="Airport">
        </div>
        <div class="ap-airport-name" id="apAirportName">
          Airport
          <span id="apCityName"></span>
        </div>
        <div style="font-size:9px;color:var(--text-dim);margin-top:2px">Carries Items:</div>
        <div style="font-size:9px;color:var(--text-dim);font-style:italic">�</div>
        <div class="ap-action-btns">
          <button class="ap-btn ap-btn-flyto" id="flyToBtn" disabled>Fly To...</button>
        </div>
      </div>

      <!-- CENTER: USA map with city dots -->
      <div class="ap-map-wrap" id="apMapWrap">
        <img src="Graphics/UI_elements/map_usa.bmp" class="ap-map-img"
             onerror="this.style.opacity='0.1'" alt="USA Map">
        <!-- city dots injected by JS -->
      </div>

    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="ap-bottom">
    <div class="ap-status" id="apStatus">Please pick the destination point.</div>
    <button class="ap-cancel-btn" onclick="window.location.href='main.html'">Cancel</button>
  </div>

</div><!-- /window -->

<script>
let gs = loadState();
if (!gs) { window.location.href = 'main.html'; }

// Ensure currentCity is always set (guard for old saves)
if (!gs.currentCity) {
  gs.currentCity = 'las_vegas';
  saveState(gs);
}

// Ensure cities exist (guard for old saves)
if (!gs.cities) {
  initCities(gs);
  saveState(gs);
}

// HUD
document.getElementById('day').textContent   = gs.day;
document.getElementById('debt').textContent  = '$' + gs.debt.toLocaleString();
document.getElementById('cash').textContent  = '$' + gs.cash.toLocaleString();
document.getElementById('daily').textContent = '$' + gs.dailyCosts.toLocaleString();

// Current city label
const curCity = CITIES.find(c => c.id === gs.currentCity) || CITIES[0];
document.getElementById('apAirportName').firstChild.textContent =
  curCity.name.split(',')[0] + " Int'l Airport";
document.getElementById('apCityName').textContent = '(' + curCity.name + ')';

// City picker state
let selectedCityId = null;
const TRAVEL_COST  = 500;

function updateFlyBtn() {
  const btn = document.getElementById('flyToBtn');
  const statusEl = document.getElementById('apStatus');
  if (!selectedCityId) {
    btn.disabled = true;
    statusEl.innerHTML = 'Please pick the destination point.';
    statusEl.className = 'ap-status';
    return;
  }
  const dest = CITIES.find(c => c.id === selectedCityId);
  if (gs.cash < TRAVEL_COST) {
    btn.disabled = true;
    statusEl.innerHTML = `<span class="ap-err">Not enough cash. Flight to ${dest.name} costs $${TRAVEL_COST.toLocaleString()}.</span>`;
  } else {
    btn.disabled = false;
    statusEl.innerHTML = `Fly to <strong style="color:#ffd080">${dest.name}</strong> � <span class="ap-cost">$${TRAVEL_COST.toLocaleString()}</span>`;
  }
}

// Render city dots on the map
const mapWrap = document.getElementById('apMapWrap');
CITIES.forEach(city => {
  const dot = document.createElement('div');
  dot.className = 'ap-city-dot' + (city.id === gs.currentCity ? ' current-city' : '');
  dot.style.left = city.dotX + '%';
  dot.style.top  = city.dotY + '%';
  dot.dataset.cityId = city.id;
  dot.innerHTML = `
    <div class="dot"></div>
    <div class="ap-city-label">${city.name.split(',')[0]}</div>`;

  if (city.id !== gs.currentCity) {
    dot.addEventListener('click', () => {
      // Deselect previous
      mapWrap.querySelectorAll('.ap-city-dot.selected').forEach(d => d.classList.remove('selected'));
      if (selectedCityId === city.id) {
        selectedCityId = null;
      } else {
        selectedCityId = city.id;
        dot.classList.add('selected');
      }
      updateFlyBtn();
    });
  }
  mapWrap.appendChild(dot);
});

updateFlyBtn();

// Fly To button
document.getElementById('flyToBtn').addEventListener('click', () => {
  if (!selectedCityId) return;
  const result = travelToCity(gs, selectedCityId);
  if (!result.ok) {
    document.getElementById('apStatus').innerHTML =
      `<span class="ap-err">${result.msg}</span>`;
    return;
  }
  gs = loadState();
  window.location.href = 'main.html';
});


</script>
</body>
</html>
